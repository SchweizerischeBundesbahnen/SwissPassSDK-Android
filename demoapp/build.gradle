apply plugin: 'com.android.application'

android {
    namespace 'ch.sbb.spc.demo'

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword 'demoapp'
            keyAlias 'key0'
            keyPassword 'demoapp'
        }
    }
    compileSdk projectAndroidVersion
    defaultConfig {
        applicationId 'ch.sbb.spc.demo'
        minSdkVersion projectAndroidMinVersion
        targetSdkVersion projectAndroidTargetVersion
        versionCode 404000
        versionName projectBuildVersion
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/ASL2.0.txt', 'META-INF/ASL2.0']
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'ch.sbb.sid.android.lib:swisspass-client:4.4.2'

    // logging is optional, if needed then use these dependencies and
    // use the logback.xml config file from assets to configure the log level INFO or WARN.
    implementation 'com.github.tony19:logback-android-core:1.1.1-6'
    implementation('com.github.tony19:logback-android-classic:1.1.1-6') {
        exclude group: 'com.google.android'
    }

}
